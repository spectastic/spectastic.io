openapi: 3.1.0
info:
  title: Position keeper — positions query
  version: 0.1.0
  description: >-
    Read-only view of current positions (004-query-endpoint). Reads go through the position
    use case and its persistence adapter; no request on this surface mutates a position.
paths:
  /positions/{instrument}:
    get:
      operationId: getPosition
      summary: Current quantity for an instrument
      parameters:
        - name: instrument
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: The instrument is known
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
              example: { instrument: AAPL, quantity: 100 }
        "404":
          description: No position has ever been booked for the instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unknown instrument }
        "405":
          description: Any method but GET — the surface is read-only
components:
  schemas:
    Position:
      type: object
      required: [instrument, quantity]
      properties:
        instrument: { type: string }
        quantity: { type: integer, format: int64, description: Signed whole units }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
